name: storyteller
services:
  gateway:
    build:
      context: ./infra/gateway
      dockerfile: Dockerfile
    image: storyteller-gateway
    container_name: storyteller_gateway
    restart: unless-stopped
    ports:
    - ${CADDY_HTTP_PORT:-80}:80
    - ${CADDY_HTTPS_PORT:-443}:443
    volumes:
    - ./storage/caddy/data:/data
    - ./storage/caddy/config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      admin:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - --spider
      - -q
      - http://localhost:80
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build:
      context: .
      dockerfile: infra/api/Dockerfile
      args:
        LARAVEL_ENV_FILE: ./application/api/.env.example
    image: storyteller-api
    container_name: storyteller_api
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      APP_URL: http://api.storyteller.test
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_DATABASE: storyteller
      DB_USERNAME: storyteller
      DB_PASSWORD: storyteller
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: 'null'
      CACHE_STORE: file
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      BROADCAST_CONNECTION: log
      MAIL_HOST: mailpit
      MAIL_PORT: '1025'
      REVERB_HOST: reverb
      REVERB_PORT: '8080'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    expose:
    - '8080'
    volumes:
    - ./storage/cache:/app/storage/framework/cache
    - ./storage/logs:/app/storage/logs
    healthcheck:
      test:
      - CMD
      - php
      - artisan
      - inspire
      interval: 15s
      timeout: 5s
      retries: 6
    extra_hosts:
    - host.docker.internal:host-gateway
  web:
    build:
      context: .
      dockerfile: infra/web/Dockerfile
    container_name: storyteller_web
    restart: unless-stopped
    expose:
    - '8080'
    healthcheck:
      test:
      - CMD
      - node
      - /usr/local/bin/healthcheck.js
      interval: 15s
      timeout: 5s
      retries: 6
  admin:
    build:
      context: .
      dockerfile: infra/admin/Dockerfile
    container_name: storyteller_admin
    restart: unless-stopped
    expose:
    - '8080'
    healthcheck:
      test:
      - CMD
      - node
      - /usr/local/bin/healthcheck.js
      interval: 15s
      timeout: 5s
      retries: 6
  postgres:
    image: pgvector/pgvector:pg17
    container_name: storyteller_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
    - ${POSTGRES_PORT:-5432}:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: docker.io/library/redis:7-alpine
    container_name: storyteller_redis
    restart: unless-stopped
    command:
    - redis-server
    - --appendonly
    - 'yes'
    ports:
    - ${REDIS_PORT:-6379}:6379
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 3s
      retries: 5
  mailpit:
    image: docker.io/axllent/mailpit:latest
    container_name: storyteller_mailpit
    restart: unless-stopped
    ports:
    - ${MAILPIT_PORT:-1025}:1025
    - ${MAILPIT_UI_PORT:-8025}:8025
    volumes:
    - ./storage/mailpit:/data
    healthcheck:
      test:
      - CMD
      - wget
      - --spider
      - -q
      - http://localhost:8025
      interval: 15s
      timeout: 5s
      retries: 5
  reverb:
    image: docker.io/library/php:8.4-cli-bookworm
    container_name: storyteller_reverb
    restart: unless-stopped
    profiles:
    - s2
    command:
    - sh
    - -c
    - echo 'reverb placeholder ΓÇö wiring in S2' && sleep infinity
    expose:
    - '8080'
networks:
  default:
    name: storyteller_default
volumes:
  postgres_data: null
  redis_data: null
  caddy_data: null
  caddy_config: null
  mailpit_data: null

