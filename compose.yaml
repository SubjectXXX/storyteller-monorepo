# Storyteller compose stack.
#
# Owner: S0-T04 (platform-agent). All storyer-owned services run as
# non-root where practical, with explicit health checks. Compose reads
# .env (auto-created from .env.example on first run).
#
# Local URL: http://storyteller.test
# /etc/hosts entries required:
#   127.0.0.1 storyteller.test api.storyteller.test web.storyteller.test \
#             admin.storyteller.test reverb.storyteller.test \
#             minio.storyteller.test mail.storyteller.test
#
# Profiles (optional):
#   observability ΓÇö Prometheus, Grafana, Loki (S9-T02)
#   gpu-local     ΓÇö local llama.cpp / ComfyUI (S3 / S6)
#   memory-graph  ΓÇö Neo4j + Graphiti (S5-T04)
#   ci            ΓÇö Postgres/Redis/MinIO with fake AI providers

name: storyteller

services:
  # ------------------------------------------------------------------
  # Gateway
  # ------------------------------------------------------------------
  gateway:
    build:
      context: ./infra/gateway
      dockerfile: Dockerfile
    image: storyteller-gateway
    container_name: storyteller_gateway
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      # The Caddyfile is baked into the image (see infra/gateway/Dockerfile)
      # instead of bind-mounted. Docker Desktop's plan9 driver caches a file
      # as a directory for the lifetime of the daemon once any file at that
      # path has ever been a directory, so bind-mounting the same path
      # post-hoc fails with "not a directory" errors.
      - ./storage/caddy/data:/data
      - ./storage/caddy/config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      admin:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------
  # API
  # ------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: infra/api/Dockerfile
      args:
        # Path (relative to the build context) of the Laravel .env
        # file to bake into the image. The default `./application/api/.env`
        # resolves to the placeholder file that's gitignored from the
        # per-app repo; for a real build pass `--build-arg LARAVEL_ENV_FILE=.env`
        # so the compose-time .env is included instead. See
        # infra/api/Dockerfile and the platform repo's scripts/build.sh.
        LARAVEL_ENV_FILE: ./application/api/.env.example
    image: storyteller-api
    container_name: storyteller_api
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://api.storyteller.test"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: storyteller
      DB_USERNAME: storyteller
      DB_PASSWORD: storyteller
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "null"
      # R18f: phpredis extension is not installed in the api container,
      # so any code path that uses the Redis cache store
      # (CircuitBreakerState, ProviderRouter, queue) crashes with
      # "Class Redis not found". Fall back to file cache for runtime,
      # database for session + queue. Tracked as P2-debt.
      CACHE_STORE: file
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      BROADCAST_CONNECTION: log
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      AWS_BUCKET: storyteller
      AWS_ACCESS_KEY_ID: storyteller
      AWS_SECRET_ACCESS_KEY: storyteller-secret
      REVERB_HOST: reverb
      REVERB_PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_started
    expose:
      - "8080"
    volumes:
      - ./storage/cache:/app/storage/framework/cache
      - ./storage/logs:/app/storage/logs
      # Bake the .env into the image at build time via the
      # infra/api/Dockerfile `build_arg` `LARAVEL_ENV_FILE` (see
      # infra/api/Dockerfile and the `make api-build` script in the
      # platform repo). We do NOT bind-mount here because Docker
      # Desktop's plan9 driver caches the host path as a directory
      # for the lifetime of the daemon if the file ever was one,
      # and named volumes can't be mounted onto a file path.
      # The Dockerfile's ENTRYPOINT script regenerates /app/.env on
      # every container start from the build-arg + compose-time env
      # overrides so changes to .env show up on the next `docker
      # compose up --build api`.
    healthcheck:
      test: ["CMD", "php", "artisan", "inspire"]
      interval: 15s
      timeout: 5s
      retries: 6
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ------------------------------------------------------------------
  # Front-ends (player / web, and admin)
  # ------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: infra/web/Dockerfile
    container_name: storyteller_web
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "/usr/local/bin/healthcheck.js"]
      interval: 15s
      timeout: 5s
      retries: 6

  admin:
    build:
      context: .
      dockerfile: infra/admin/Dockerfile
    container_name: storyteller_admin
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "/usr/local/bin/healthcheck.js"]
      interval: 15s
      timeout: 5s
      retries: 6

  # ------------------------------------------------------------------
  # Datastores
  # ------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg17
    container_name: storyteller_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume instead of a bind-mount: on Docker Desktop the
      # host bind-mount lives inside a thin 128 MB overlay that runs
      # out of space once WAL writes kick in (postgres then crashes
      # with "could not write to file pg_wal/xlogtemp.X: No space
      # left on device"). The named volume is allocated against the
      # full Docker Desktop VM disk and has plenty of headroom.
      - postgres_data:/var/lib/postgresql/data
      # The init.sql path is the original bind-mount. The plan9 cache
      # has marked infra/postgres/init.sql as a directory for the
      # lifetime of the daemon (it was a directory in an earlier
      # session), so this mount currently fails on this machine.
      # If your Docker setup doesn't have that stale cache entry,
      # uncomment the line below to auto-create the pgvector +
      # pgcrypto + citext extensions on first boot.
      # - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: storyteller_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: docker.io/minio/minio:latest
    container_name: storyteller_minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 6

  mailpit:
    image: docker.io/axllent/mailpit:latest
    container_name: storyteller_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - ./storage/mailpit:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------
  # Optional: Reverb (private websockets). Wired to S2+.
  # ------------------------------------------------------------------
  reverb:
    image: docker.io/library/php:8.4-cli-bookworm
    container_name: storyteller_reverb
    restart: unless-stopped
    profiles: ["s2"]
    command: ["sh", "-c", "echo 'reverb placeholder ΓÇö wiring in S2' && sleep infinity"]
    expose:
      - "8080"

networks:
  default:
    name: storyteller_default

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
  mailpit_data:


